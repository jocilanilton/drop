<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de Números</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="card shadow-lg rounded-4 p-4">
      <h2 class="mb-4 text-center">Gerador de Números com Drop e Metragem</h2>

      <div class="row mb-3">
        <div class="col-md-6 mb-3">
          <label for="dropSelect" class="form-label">Selecione o Drop</label>
          <select id="dropSelect" class="form-select">
            <option value="">-- Selecione --</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="150">150</option>
            <option value="200">200</option>
            <option value="300">300</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label for="metragemInput" class="form-label">Metragem utilizada</label>
          <input
            type="number"
            id="metragemInput"
            class="form-control"
            placeholder="Digite a metragem"
            min="1"
          />
        </div>
      </div>

      <div class="text-center mb-4">
        <button class="btn btn-primary px-4" onclick="gerarNumeros()">Gerar</button>
      </div>

      <div
        id="resultado"
        class="alert d-none text-center fw-bold fs-5"
      ></div>
    </div>
  </div>

  <script>
    function gerarNumeros() {
      const drop = parseInt(document.getElementById("dropSelect").value);
      const metragem = parseInt(document.getElementById("metragemInput").value);
      const resultado = document.getElementById("resultado");

      if (isNaN(drop) || isNaN(metragem) || metragem <= 0) {
        resultado.className = "alert alert-danger text-center fw-bold fs-5";
        resultado.textContent =
          "Por favor, selecione o drop e insira uma metragem válida.";
        resultado.classList.remove("d-none");
        return;
      }

      if (metragem > drop) {
        resultado.className = "alert alert-danger text-center fw-bold fs-5";
        resultado.textContent =
          `Erro: a metragem utilizada (${metragem}) não pode ser maior que o Drop selecionado (${drop}).`;
        resultado.classList.remove("d-none");
        return;
      }

      const numeroInicial = Math.floor(Math.random() * 9000) + 1000;
      const numeroFinal = numeroInicial + metragem;

      resultado.className = "alert alert-success text-center fw-bold fs-5";
      resultado.innerHTML = `
        Drop: ${drop} | Metragem: ${metragem}m<br>
        Número Inicial: ${numeroInicial}<br>
        Número Final: ${numeroFinal}
      `;
      resultado.classList.remove("d-none");
    }
  </script>
</body>
</html>

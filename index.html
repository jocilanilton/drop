
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d47a1">

  <title>Gerador de Números | Drop e Metragem</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #155eef;
      --primary-dark: #1046b3;
      --background: #f3f6fc;
      --text: #182230;
      --muted: #667085;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #dce8ff 0, transparent 38%),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 32px 0;
    }

    .main-card {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e4eaf3;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(16, 36, 75, .10);
    }

    .header {
      padding: 32px 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #155eef, #123c91);
    }

    .header-icon {
      display: inline-flex;
      width: 58px;
      height: 58px;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 18px;
      font-size: 28px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header p {
      color: #dbe7ff;
      margin: 0;
      font-size: .95rem;
    }

    .form-area {
      padding: 30px;
    }

    .form-label {
      font-weight: 700;
      font-size: .92rem;
      margin-bottom: 9px;
    }

    .form-select,
    .form-control {
      min-height: 52px;
      border-radius: 12px;
      border-color: #d0d9e8;
      padding: 12px 14px;
    }

    .form-select:focus,
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21, 94, 239, .12);
    }

    .help-text {
      display: block;
      color: var(--muted);
      font-size: .8rem;
      margin-top: 7px;
    }

    .btn {
      min-height: 48px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .result-card {
      display: none;
      margin-top: 26px;
      padding: 22px;
      border: 1px solid #b8e7cc;
      border-radius: 18px;
      background: linear-gradient(145deg, #f0fdf4, #fff);
    }

    .result-card.visible {
      display: block;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-heading {
      color: #166534;
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .result-number {
      background: #fff;
      border: 1px solid #dce8e0;
      border-radius: 14px;
      padding: 16px;
      height: 100%;
    }

    .result-number span {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 7px;
    }

    .result-number strong {
      display: block;
      color: #166534;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result-meta {
      margin-top: 16px;
      color: #475467;
      font-size: .9rem;
    }

    .alert {
      border-radius: 12px;
      font-size: .92rem;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 0 20px 24px;
    }

    @media (max-width: 575px) {
      body {
        padding: 14px 10px;
      }

      .main-card {
        border-radius: 18px;
      }

      .header {
        padding: 26px 18px;
      }

      .form-area {
        padding: 22px 18px;
      }

      .result-card {
        padding: 16px;
      }

      .action-buttons .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="main-card">

      <header class="header">
        <div class="header-icon" aria-hidden="true">🔢</div>
        <h1>Gerador de Números</h1>
        <p>Controle de Drop e Metragem</p>
      </header>

      <div class="form-area">

        <div
          id="mensagem"
          class="alert d-none"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="geradorForm" novalidate>
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="dropSelect" class="form-label">
                Selecione o Drop
              </label>

              <select
                id="dropSelect"
                class="form-select"
                required
                aria-describedby="dropHelp"
              >
                <option value="">Selecione uma opção</option>
                <option value="50">50 metros</option>
                <option value="100">100 metros</option>
                <option value="150">150 metros</option>
                <option value="200">200 metros</option>
                <option value="300">300 metros</option>
              </select>

              <small id="dropHelp" class="help-text">
                Escolha o tamanho do Drop.
              </small>
            </div>

            <div class="col-12 col-md-6">
              <label for="metragemInput" class="form-label">
                Metragem utilizada
              </label>

              <div class="input-group">
                <input
                  type="number"
                  id="metragemInput"
                  class="form-control"
                  placeholder="Ex.: 25"
                  min="1"
                  step="1"
                  inputmode="numeric"
                  required
                  aria-describedby="metragemHelp"
                >
                <span class="input-group-text">metros</span>
              </div>

              <small id="metragemHelp" class="help-text">
                Informe um número inteiro entre 1 e o Drop selecionado.
              </small>
            </div>

          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">
              ⚡ Gerar números
            </button>
          </div>
        </form>

        <section
          id="resultado"
          class="result-card"
          aria-live="polite"
          aria-labelledby="resultadoTitulo"
        >
          <h2 id="resultadoTitulo" class="result-heading">
            ✓ Números gerados com sucesso!
          </h2>

          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <div class="result-number">
                <span>Número inicial</span>
                <strong id="numeroInicial">0000</strong>
              </div>
            </div>

            <div class="col-12 col-sm-6">
              <div class="result-number">
                <span>Número final</span>
                <strong id="numeroFinal">0000</strong>
              </div>
            </div>
          </div>

          <div class="result-meta">
            <div id="resumo"></div>
          </div>

          <div class="d-flex flex-column flex-sm-row gap-2 mt-4 action-buttons">
            <button
              type="button"
              id="copiarBtn"
              class="btn btn-success flex-fill"
            >
              📋 Copiar resultado
            </button>

            <button
              type="button"
              id="novoBtn"
              class="btn btn-outline-primary flex-fill"
            >
              🔄 Gerar novamente
            </button>
          </div>
        </section>

      </div>

      <footer class="footer">
        Gerador de números • Preencha os campos para começar.
      </footer>

    </section>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("geradorForm");
    const dropSelect = document.getElementById("dropSelect");
    const metragemInput = document.getElementById("metragemInput");
    const mensagem = document.getElementById("mensagem");
    const resultado = document.getElementById("resultado");
    const copiarBtn = document.getElementById("copiarBtn");
    const novoBtn = document.getElementById("novoBtn");

    let ultimoResultado = null;

    function mostrarMensagem(texto, tipo = "danger") {
      mensagem.className = `alert alert-${tipo}`;
      mensagem.textContent = texto;
    }

    function limparMensagem() {
      mensagem.className = "alert d-none";
      mensagem.textContent = "";
    }

    function esconderResultado() {
      resultado.classList.remove("visible");
    }

    function validarCampos() {
      limparMensagem();

      dropSelect.classList.remove("is-invalid");
      metragemInput.classList.remove("is-invalid");

      const drop = Number(dropSelect.value);
      const valorMetragem = metragemInput.value.trim();
      const metragem = Number(valorMetragem);

      if (!dropSelect.value || !Number.isInteger(drop) || drop <= 0) {
        dropSelect.classList.add("is-invalid");
        mostrarMensagem("Selecione um Drop válido.");
        dropSelect.focus();
        return null;
      }

      if (
        valorMetragem === "" ||
        !Number.isFinite(metragem) ||
        !Number.isInteger(metragem) ||
        metragem <= 0
      ) {
        metragemInput.classList.add("is-invalid");
        mostrarMensagem(
          "Informe uma metragem inteira maior que zero, sem casas decimais."
        );
        metragemInput.focus();
        return null;
      }

      if (metragem > drop) {
        metragemInput.classList.add("is-invalid");
        mostrarMensagem(
          `A metragem (${metragem} m) não pode ultrapassar o Drop selecionado (${drop} m).`
        );
        metragemInput.focus();
        return null;
      }

      return { drop, metragem };
    }

    function gerarNumeroInicial() {
      // Gera um inteiro entre 1000 e 9999, inclusive.
      return Math.floor(Math.random() * 9000) + 1000;
    }

    function gerarNumeros() {
      const dados = validarCampos();

      if (!dados) {
        esconderResultado();
        ultimoResultado = null;
        return;
      }

      const { drop, metragem } = dados;
      const numeroInicial = gerarNumeroInicial();
      const numeroFinal = numeroInicial + metragem;

      ultimoResultado = {
        drop,
        metragem,
        numeroInicial,
        numeroFinal
      };

      document.getElementById("numeroInicial").textContent =
        numeroInicial;

      document.getElementById("numeroFinal").textContent =
        numeroFinal;

      document.getElementById("resumo").textContent =
        `Drop: ${drop} m • Metragem utilizada: ${metragem} m`;

      limparMensagem();
      resultado.classList.add("visible");

      resultado.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      gerarNumeros();
    });

    novoBtn.addEventListener("click", gerarNumeros);

    copiarBtn.addEventListener("click", async function() {
      if (!ultimoResultado) {
        mostrarMensagem("Gere os números antes de copiar.");
        return;
      }

      const { drop, metragem, numeroInicial, numeroFinal } =
        ultimoResultado;

      const texto =
        `GERADOR DE NÚMEROS\n` +
        `Drop: ${drop} m\n` +
        `Metragem: ${metragem} m\n` +
        `Número inicial: ${numeroInicial}\n` +
        `Número final: ${numeroFinal}`;

      try {
        await navigator.clipboard.writeText(texto);
        mostrarMensagem("Resultado copiado com sucesso!", "success");
      } catch (erro) {
        // Alternativa para navegadores sem acesso à Clipboard API.
        const area = document.createElement("textarea");
        area.value = texto;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();

        const copiado = document.execCommand("copy");
        area.remove();

        if (copiado) {
          mostrarMensagem("Resultado copiado com sucesso!", "success");
        } else {
          mostrarMensagem(
            "Não foi possível copiar automaticamente. Selecione e copie o resultado manualmente."
          );
        }
      }
    });

    dropSelect.addEventListener("change", function() {
      dropSelect.classList.remove("is-invalid");
      metragemInput.classList.remove("is-invalid");
      limparMensagem();
      esconderResultado();

      const drop = Number(dropSelect.value);

      if (drop > 0) {
        metragemInput.max = String(drop);
        metragemInput.placeholder = `Máximo: ${drop} metros`;
      } else {
        metragemInput.removeAttribute("max");
        metragemInput.placeholder = "Ex.: 25";
      }
    });

    metragemInput.addEventListener("input", function() {
      metragemInput.classList.remove("is-invalid");
      limparMensagem();
      esconderResultado();
    });
  </script>
</body>
</html>
